          <tspan dx="10" class="mono" font-size="10.5" font-weight="600" fill="#5A524A" letter-spacing="0.5">QUEUE SYNC</tspan>
        </text>
      </g>
      <g>
        <rect x="482" y="268" width="214" height="38" rx="7" fill="#FDFCFA" stroke="#E2D5C6" stroke-width="1.2"/>
        <text x="498" y="292">
          <tspan class="serif" font-size="16" font-weight="800" fill="#9E3D2B">~700 ms</tspan>
          <tspan dx="10" class="mono" font-size="10.5" font-weight="600" fill="#5A524A" letter-spacing="0.5">VOICE PIPELINE</tspan>
        </text>
      </g>
      <g>
        <rect x="708" y="268" width="236" height="38" rx="7" fill="#FDFCFA" stroke="#E2D5C6" stroke-width="1.2"/>
        <text x="724" y="292">
          <tspan class="serif" font-size="16" font-weight="800" fill="#9E3D2B">SoWeBuild.in</tspan>
          <tspan dx="10" class="mono" font-size="10.5" font-weight="600" fill="#5A524A" letter-spacing="0.5">STUDIO &amp; AGENCY</tspan>
        </text>
      </g>

  <!-- ── LOCATION & AVAILABILITY STATUS (Offset to x: 280) ── -->
  <g transform="translate(280, 336)">
    <circle cx="8" cy="8" r="4" fill="#566449"/>
    <circle cx="8" cy="8" r="4" fill="none" stroke="#566449" stroke-width="1.6" opacity="0.6"/>
    <text x="24" y="12" class="mono" font-size="11" font-weight="600" fill="#5A524A" letter-spacing="1.2">
      MUMBAI, IN (IST UTC+5:30)  ·  OPEN TO BACKEND &amp; FOUNDING ROLES  ·  CONSULTING VIA SOWEBUILD.IN
    </text>
  </g>

  <!-- ── RIGHT SPECIMEN CARD (HARDCOVER ARCHITECTURE LEDGER) ── -->
  <rect x="992" y="32" width="544" height="332" rx="9" fill="#FDFCFA" stroke="#E2D5C6" stroke-width="1.4" filter="url(#cardShadow)"/>
  <rect x="1000" y="40" width="528" height="316" rx="6" fill="none" stroke="#EDE4D9" stroke-width="1" stroke-dasharray="1 4"/>

  <!-- Card Masthead -->
  <text x="1016" y="66" class="mono" font-size="10.5" font-weight="700" fill="#9E3D2B" letter-spacing="2.2">PRODUCTION BENCHMARKS &amp; TELEMETRY</text>
  <text x="1512" y="66" class="mono" font-size="10" font-weight="700" fill="#566449" letter-spacing="1.6" text-anchor="end">LIVE SIGNALS</text>
  <text x="1016" y="92" class="serif" font-size="21" font-weight="800" fill="#1A1816">Verified Production Systems</text>
  <line x1="1016" y1="102" x2="1512" y2="102" stroke="#E2D5C6" stroke-width="1.2"/>

  <!-- Telemetry Rows -->
  
      <!-- Row 1 -->
      <text x="1016" y="122" class="serif" font-size="14.5" font-weight="800" fill="#1A1816">Async Message-Queue Sync</text>
      <text x="1016" y="136" class="mono" font-size="9.5" font-weight="700" fill="#5A524A" letter-spacing="0.6">FLEXBASE · POLLING CRONS ELIMINATED</text>

      <!-- Progress bar -->
      <rect x="1016" y="144" width="200" height="7" rx="3.5" fill="#F4EDE2"/>
      <rect x="1016" y="144" width="192" height="7" rx="3.5" fill="#9E3D2B"/>

      <!-- Metric badge on right of card -->
      <text x="1512" y="125" class="serif" font-size="19" font-weight="900" fill="#9E3D2B" text-anchor="end">15m → 4s</text>
      <text x="1512" y="141" class="mono" font-size="10" font-weight="700" fill="#5A524A" letter-spacing="0.5" text-anchor="end">−99.5%</text>
      <line x1="1016" y1="161" x2="1512" y2="161" stroke="#E2D5C6" stroke-width="1" stroke-dasharray="2 4"/>
    
      <!-- Row 2 -->
      <text x="1016" y="184" class="serif" font-size="14.5" font-weight="800" fill="#1A1816">Real-Time Voice AI Pipeline</text>
      <text x="1016" y="198" class="mono" font-size="9.5" font-weight="700" fill="#5A524A" letter-spacing="0.6">KRISHORA · PIPECAT · EXOTEL · CUDA</text>

      <!-- Progress bar -->
      <rect x="1016" y="206" width="200" height="7" rx="3.5" fill="#F4EDE2"/>
      <rect x="1016" y="206" width="144" height="7" rx="3.5" fill="#566449"/>

      <!-- Metric badge on right of card -->
      <text x="1512" y="187" class="serif" font-size="19" font-weight="900" fill="#566449" text-anchor="end">~700 ms</text>
      <text x="1512" y="203" class="mono" font-size="10" font-weight="700" fill="#5A524A" letter-spacing="0.5" text-anchor="end">GPU STREAM</text>
      <line x1="1016" y1="223" x2="1512" y2="223" stroke="#E2D5C6" stroke-width="1" stroke-dasharray="2 4"/>
    
      <!-- Row 3 -->
      <text x="1016" y="246" class="serif" font-size="14.5" font-weight="800" fill="#1A1816">Stateless SVG Edge API</text>
      <text x="1016" y="260" class="mono" font-size="9.5" font-weight="700" fill="#5A524A" letter-spacing="0.6">DEVPIC · EDGE RUNTIME · ZERO DB</text>

      <!-- Progress bar -->
      <rect x="1016" y="268" width="200" height="7" rx="3.5" fill="#F4EDE2"/>
      <rect x="1016" y="268" width="176" height="7" rx="3.5" fill="#7A2E20"/>

      <!-- Metric badge on right of card -->
      <text x="1512" y="249" class="serif" font-size="19" font-weight="900" fill="#7A2E20" text-anchor="end">&lt; 10 ms</text>
      <text x="1512" y="265" class="mono" font-size="10" font-weight="700" fill="#5A524A" letter-spacing="0.5" text-anchor="end">SUB-10MS TTFB</text>
      
    

  <!-- Card Footer: Tech Stack Pills & URLs -->
  <line x1="1016" y1="308" x2="1512" y2="308" stroke="#E2D5C6" stroke-width="1"/>
  <text x="1016" y="334" class="mono" font-size="10.5" font-weight="700" fill="#5A524A" letter-spacing="1.1">
    NODE.JS · TYPESCRIPT · PYTHON · KOTLIN · POSTGRESQL · REDIS
