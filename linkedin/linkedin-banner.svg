<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <title>Om Thakur — LinkedIn Banner</title>
  <defs>
    <style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
.serif { font-family: "Playfair Display", Georgia, "Iowan Old Style", "Apple Garamond", serif; }
.mono { font-family: "Geist Mono", "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace; }
.blink { animation: blink 1.1s step-end infinite; }
@keyframes blink { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
</style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2C2318" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas & Monograph Background -->
  <rect x="0" y="0" width="1584" height="396" fill="#FAF6F1"/>
  <rect x="1" y="1" width="1582" height="394" rx="0" fill="none" stroke="#E2D5C6" stroke-width="2"/>
  <rect x="12" y="12" width="1560" height="372" rx="4" fill="none" stroke="#D4C3AF" stroke-opacity="0.6" stroke-dasharray="1 5" stroke-linecap="round"/>

  <!-- Left decorative subtle seal (sitting behind avatar zone as an watermark) -->
  <g opacity="0.14" transform="translate(136, 320)">
    <circle cx="0" cy="0" r="88" fill="none" stroke="#9E3D2B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#1A1816" stroke-width="1"/>
    <text x="0" y="-8" class="mono" font-size="11" font-weight="700" fill="#1A1816" letter-spacing="2" text-anchor="middle">FOUNDING ENG</text>
    <text x="0" y="12" class="mono" font-size="9" font-weight="600" fill="#9E3D2B" letter-spacing="1.5" text-anchor="middle">KRISHORA · SOWEBUILD</text>
  </g>

  <!-- ── TOP MASTHEAD BANNER ── -->
  <text x="48" y="44" class="serif" font-size="15" font-weight="800" fill="#1A1816" letter-spacing="3.2">OM THAKUR</text>
  <rect x="180" y="37" width="5.5" height="5.5" fill="#9E3D2B" transform="rotate(45 183 40)"/>
  <text x="198" y="44" class="mono" font-size="11" font-weight="700" fill="#9E3D2B" letter-spacing="2.2">ENGINEERING MONOGRAPH</text>
  <rect x="410" y="37" width="5.5" height="5.5" fill="#5A524A" transform="rotate(45 413 40)"/>
  <text x="428" y="44" class="mono" font-size="11" font-weight="600" fill="#5A524A" letter-spacing="2">VOLUME I · MMXXVI</text>

  <line x1="48" y1="56" x2="948" y2="56" stroke="#E2D5C6" stroke-width="1"/>

  <!-- ── HERO IDENTITY & SPECIALIZATION ── -->
  <text x="48" y="96" class="mono" font-size="12.5" font-weight="700" fill="#9E3D2B" letter-spacing="2.4">FOUNDING SOFTWARE ENGINEER @ KRISHORA  ·  FOUNDER @ SOWEBUILD.IN</text>

  <!-- Name & Tagline -->
  <text x="46" y="162" class="serif" font-size="58" font-weight="900" fill="#1A1816" letter-spacing="-1">Om Thakur<tspan fill="#9E3D2B">.</tspan></text>
  <line x1="48" y1="178" x2="340" y2="178" stroke="#9E3D2B" stroke-width="2.5"/>
  <text x="48" y="214" class="serif" font-size="25" font-style="italic" fill="#9E3D2B">Scalable Backends &amp; Distributed Systems</text>

  <!-- Terminal whoami prompt line -->
  <text x="48" y="248" class="mono" font-size="14" fill="#3A342E">
    <tspan fill="#9E3D2B" font-weight="700">$ </tspan>whoami <tspan fill="#9E3D2B">→</tspan> High-concurrency APIs, message queues &amp; real-time voice pipelines<tspan fill="#9E3D2B" class="blink" font-weight="700"> ▋</tspan>
  </text>

  <!-- ── 3 METRIC CHIPS (Offset to x: 300 so clear of avatar) ── -->
  
      <g>
        <rect x="280" y="268" width="190" height="38" rx="7" fill="#FDFCFA" stroke="#E2D5C6" stroke-width="1.2"/>
        <text x="296" y="292">
